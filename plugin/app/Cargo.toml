[package]
name = "soap-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Soap desktop app: clean voice recordings on your computer with the Desert Ant Labs Clear model"
publish = false

[dependencies]
soap = { path = ".." }
arc-swap = "1"
cpal = "0.15"
eframe = { version = "0.31", features = ["persistence"] }
hound = "3.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
